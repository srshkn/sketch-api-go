openapi: 3.0.3
info:
  title: Sketch API on GO
  description: Тестовый API сервис написанный на Go.
  version: "1.0.0"

servers:
  - url: http://localhost:8080

tags:
  - name: Meta
  - name: User

components:

  schemas:

    RegisterUserRequest:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
          minLength: 5
        password:
          type: string
          format: password
          minLength: 8

    UserResponse:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - INVALID_REQUEST
                - UNAUTHORIZED
                - NOT_FOUND
                - ROOM_NOT_FOUND
                - SLOT_NOT_FOUND
                - SLOT_ALREADY_BOOKED
                - BOOKING_NOT_FOUND
                - FORBIDDEN
                - SCHEDULE_EXISTS
                - INTERNAL_ERROR
            message:
              type: string
      example:
        error:
          code: INVALID_REQUEST
          message: invalid request

    InternalErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

paths:
  /health:
    get:
      tags: [Meta]
      summary: "Проверка жизни API."
      description: >
        Endpoint предназначен для проверки работоспособности API.
        Возвращает "OK" и статус 200, если сервис жив.
      operationId: getHealth
      responses:
        "200":
          description: API работает корректно
          content:
            text/plain:
              schema:
                type: string
                example: OK
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"

  /user/register:
    post:
      tags: [User]
      summary: "Регистрация пользователя."
      description: "..."
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'

      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/UserResponse'

        '400':
          description: Неверный запрос
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

        "409":
          description: Пользователь уже существует
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalErrorResponse' }
